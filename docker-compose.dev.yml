# Dev-Profil: Hot-Reload fuer Backend (dotnet watch) und Frontend (Vite), eigenes Datenvolume.
name: baton

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      # Handys oeffnen im Dev-Betrieb die Vite-Oberflaeche (die zum Backend weiterleitet).
      Deck__PublicPort: ${FRONTEND_PORT:-5200}
      # Anfragen vom Host kommen im Docker-Netz ueber das Bridge-Gateway bzw. den Vite-Proxy an,
      # nicht ueber 127.0.0.1 - fuer die Ersteinrichtung im Dev-Stack daher genau dieses (unten fest
      # vergebene) Projektnetz erlauben.
      # (In der installierten App gilt ausschliesslich Loopback.)
      Deck__BootstrapAllowedNetworks: 10.200.52.0/24
    volumes:
      - ./backend:/app
      - backend_bin:/app/bin
      - backend_obj:/app/obj
      - backend_nuget:/root/.nuget/packages
      - data_dev:/data
    ports:
      - "${BACKEND_PORT:-5201}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      DECK_BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./branding.json:/branding.json:ro
    ports:
      - "${FRONTEND_PORT:-5200}:5200"
    depends_on:
      - backend

networks:
  default:
    ipam:
      config:
        - subnet: 10.200.52.0/24

volumes:
  backend_bin:
  backend_obj:
  backend_nuget:
  data_dev:
  frontend_node_modules:
