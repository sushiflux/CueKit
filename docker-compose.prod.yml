# Prod-/Live-Profil: gebautes Image wie die ausgelieferte App (Oberflaeche aus wwwroot), eigenes
# Datenvolume - Testdaten aus dem Dev-Profil koennen hier nie landen.
name: cuekit-live

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Deck__PublicPort: ${LIVE_PORT:-5202}
    volumes:
      - data_live:/data
    ports:
      - "${LIVE_PORT:-5202}:8080"
    restart: unless-stopped

volumes:
  data_live:
