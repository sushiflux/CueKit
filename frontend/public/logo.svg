<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#3b2fc9"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Grundflaeche -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <!-- Q: kraeftiger Ring -->
  <circle cx="30" cy="30" r="14" fill="none" stroke="#ffffff" stroke-width="7"/>
  <!-- Schweif laeuft DURCH den Ring (typische Q-Form, keine Lupe) - Akzentfarbe = "Cue"-Signal -->
  <line x1="33" y1="33" x2="47" y2="47" stroke="#2a1f8f" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" transform="translate(0 1.5)"/>
  <line x1="33" y1="33" x2="47" y2="47" stroke="url(#tail)" stroke-width="8" stroke-linecap="round"/>
</svg>
